<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathForge – Personalized Career Roadmap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-cpu-fill me-2"></i>PATHFORGE</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/roadmap.html">Roadmap</a></li>
                    <li class="nav-item"><a class="nav-link" href="/assessment.html">Assessment</a></li>
                    <li class="nav-item"><a class="nav-link" href="/projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="/youtube.html">YouTube Analyzer</a></li>
                </ul>
                <div id="navUserContainer" class="d-flex align-items-center"></div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="pf-card mb-4">
                    <span id="targetRoleBadge" class="badge bg-primary bg-opacity-25 text-info px-3 py-2 rounded-pill mb-2">Target Career: Backend Developer</span>
                    <h2 id="roadmapTitle" class="fw-bold text-white mb-2">Personalized Career Roadmap</h2>
                    <p class="text-secondary mb-0">Your roadmap dynamically adapts as you complete skills, watch learning videos, take quizzes, and build real-world projects.</p>
                </div>

                <div id="roadmapTimeline"></div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function loadRoadmap() {
            try {
                const data = await apiFetch('/roadmap');
                document.getElementById('roadmapTitle').textContent = data.title;
                document.getElementById('targetRoleBadge').textContent = `Target Career: ${data.targetCareerTitle}`;

                const container = document.getElementById('roadmapTimeline');
                container.innerHTML = data.phases.map(p => `
                    <div class="timeline-item">
                        <div class="timeline-icon">${p.phaseNumber}</div>
                        <div class="pf-card">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h4 class="fw-bold text-white mb-0">${p.title}</h4>
                                <span class="badge ${p.status === 'COMPLETED' ? 'bg-success' : (p.status === 'IN_PROGRESS' ? 'bg-warning text-dark' : 'bg-secondary')}">${p.status}</span>
                            </div>
                            <p class="text-secondary mb-3">${p.description}</p>
                            
                            <!-- "WHY THIS NEXT?" Feature (Requirement #10) -->
                            <div class="why-box">
                                <div class="why-box-title"><i class="bi bi-question-circle-fill me-1"></i> WHY THIS NEXT?</div>
                                <p class="text-light mb-0 small">${p.whyRecommended}</p>
                            </div>

                            <div class="d-flex gap-2 mt-3">
                                <a href="/youtube.html" class="btn btn-sm btn-pf-outline"><i class="bi bi-youtube me-1"></i>Learn via YouTube Analyzer</a>
                                <a href="/projects.html" class="btn btn-sm btn-pf-primary"><i class="bi bi-kanban me-1"></i>Build Matching Project</a>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch(err) {
                console.error(err);
            }
        }

        loadRoadmap();
    </script>
</body>
</html>
