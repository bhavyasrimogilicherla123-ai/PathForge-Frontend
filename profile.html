<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathForge – Student Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-cpu-fill me-2"></i>PATHFORGE</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/roadmap.html">Roadmap</a></li>
                    <li class="nav-item"><a class="nav-link" href="/assessment.html">Assessment</a></li>
                    <li class="nav-item"><a class="nav-link" href="/projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="/youtube.html">YouTube Analyzer</a></li>
                </ul>
                <div id="navUserContainer" class="d-flex align-items-center"></div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="pf-card mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="fw-bold text-white mb-0"><i class="bi bi-person-lines-fill text-info me-2"></i>Student Profile & Career Setup</h3>
                        <span id="stageBadge" class="stage-badge">Explorer</span>
                    </div>

                    <div id="successAlert" class="alert alert-success d-none mb-3">Profile updated successfully!</div>
                    <div id="errorAlert" class="alert alert-danger d-none mb-3"></div>

                    <form id="profileForm">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-secondary">Student Name</label>
                                <input type="text" id="name" class="form-control bg-dark text-light border-secondary" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary">Email Address</label>
                                <input type="email" id="email" class="form-control bg-dark text-light border-secondary" readonly>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label text-secondary">Branch</label>
                                <select id="branch" class="form-select bg-dark text-light border-secondary">
                                    <option value="CSE">CSE</option>
                                    <option value="IT">IT</option>
                                    <option value="AI & ML">AI & ML</option>
                                    <option value="Data Science">Data Science</option>
                                    <option value="ECE">ECE</option>
                                    <option value="EEE">EEE</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-secondary">Year</label>
                                <select id="year" class="form-select bg-dark text-light border-secondary">
                                    <option value="1st Year">1st Year</option>
                                    <option value="2nd Year">2nd Year</option>
                                    <option value="3rd Year">3rd Year</option>
                                    <option value="4th Year">4th Year</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-secondary">Semester</label>
                                <select id="semester" class="form-select bg-dark text-light border-secondary">
                                    <option value="Semester 1">Semester 1</option>
                                    <option value="Semester 2">Semester 2</option>
                                    <option value="Semester 3">Semester 3</option>
                                    <option value="Semester 4">Semester 4</option>
                                    <option value="Semester 5">Semester 5</option>
                                    <option value="Semester 6">Semester 6</option>
                                    <option value="Semester 7">Semester 7</option>
                                    <option value="Semester 8">Semester 8</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary fw-bold">Target Career Goal</label>
                            <select id="careerGoalId" class="form-select bg-dark text-light border-info">
                                <!-- Populated dynamically -->
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary fw-bold">Technical Interests & Focus Areas</label>
                            <textarea id="interests" class="form-control bg-dark text-light border-secondary" rows="2" placeholder="e.g. Backend Development, Microservices, Spring Boot, MySQL"></textarea>
                        </div>

                        <button type="submit" class="btn btn-pf-primary w-100"><i class="bi bi-save me-2"></i>Save & Update Career Roadmap</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function loadProfile() {
            try {
                const careers = await apiFetch('/careers');
                const careerSelect = document.getElementById('careerGoalId');
                careerSelect.innerHTML = careers.map(c => `<option value="${c.id}">${c.title} – ${c.description}</option>`).join('');

                const profile = await apiFetch('/student/profile');
                document.getElementById('name').value = profile.name || '';
                document.getElementById('email').value = profile.email || '';
                document.getElementById('branch').value = profile.branch || 'CSE';
                document.getElementById('year').value = profile.year || '3rd Year';
                document.getElementById('semester').value = profile.semester || 'Semester 5';
                document.getElementById('interests').value = profile.interests || '';
                document.getElementById('stageBadge').textContent = 'Current Stage: ' + (profile.currentStage || 'Explorer');

                if (profile.careerGoalId) {
                    careerSelect.value = profile.careerGoalId;
                }
            } catch(err) {
                console.error(err);
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const branch = document.getElementById('branch').value;
            const year = document.getElementById('year').value;
            const semester = document.getElementById('semester').value;
            const careerGoalId = parseInt(document.getElementById('careerGoalId').value);
            const interests = document.getElementById('interests').value;

            try {
                await apiFetch('/student/profile', {
                    method: 'PUT',
                    body: JSON.stringify({ branch, year, semester, careerGoalId, interests })
                });

                document.getElementById('successAlert').classList.remove('d-none');
                setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
            } catch(err) {
                document.getElementById('errorAlert').textContent = err.message;
                document.getElementById('errorAlert').classList.remove('d-none');
            }
        });

        loadProfile();
    </script>
</body>
</html>
